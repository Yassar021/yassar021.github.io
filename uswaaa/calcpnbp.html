<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator PNBP - Kantah Mamuju Tengah</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            500: '#d97706', // Amber-like color matching BPN accent
                            600: '#b45309',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar for a cleaner dark UI */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        
        /* Hide number input spinners */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4 sm:p-8 selection:bg-brand-500 selection:text-white">

    <!-- Background Decoration -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-brand-600/10 blur-[100px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-600/10 blur-[100px]"></div>
    </div>

    <div class="w-full max-w-2xl glass-panel rounded-3xl shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Header -->
        <div class="p-6 sm:p-8 border-b border-slate-800 bg-slate-900/50 flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700 shadow-inner">
                <i class="fa-solid fa-map-location-dot text-brand-500 text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-white tracking-tight">Kalkulator PNBP</h1>
                <p class="text-slate-400 text-sm mt-1">Kementerian ATR/BPN Kantah Mamuju Tengah</p>
            </div>
        </div>

        <!-- Form Content -->
        <div class="p-6 sm:p-8 space-y-8">
            
            <!-- Model Selection -->
            <div class="space-y-3">
                <label class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Model Layanan</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <button type="button" onclick="setModel(1)" id="btn-model-1" class="model-btn relative p-4 rounded-xl border-2 border-brand-500 bg-brand-500/10 text-white font-medium text-sm transition-all text-left flex flex-col gap-2">
                        <i class="fa-solid fa-ruler-combined text-brand-500"></i>
                        <span>Pengukuran Pertama</span>
                    </button>
                    <button type="button" onclick="setModel(2)" id="btn-model-2" class="model-btn relative p-4 rounded-xl border-2 border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 font-medium text-sm transition-all text-left flex flex-col gap-2">
                        <i class="fa-solid fa-draw-polygon text-slate-400"></i>
                        <span>Penataan Batas</span>
                    </button>
                    <button type="button" onclick="setModel(3)" id="btn-model-3" class="model-btn relative p-4 rounded-xl border-2 border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 font-medium text-sm transition-all text-left flex flex-col gap-2">
                        <i class="fa-solid fa-chart-pie text-slate-400"></i>
                        <span>Pemecahan</span>
                    </button>
                </div>
            </div>

            <!-- Jenis Tanah Selection -->
            <div class="space-y-3">
                <label class="text-sm font-semibold text-slate-300 uppercase tracking-wider">Jenis Penggunaan</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <button type="button" onclick="setJenis(60)" id="btn-jenis-60" class="jenis-btn relative p-4 rounded-xl border-2 border-brand-500 bg-brand-500/10 text-white font-medium text-sm transition-all flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-900/50 flex items-center justify-center">
                            <i class="fa-solid fa-leaf text-brand-500"></i>
                        </div>
                        <div class="text-left">
                            <div class="block">Pertanian</div>
                            <div class="text-xs text-brand-500/80 font-normal">Koefisien: 60</div>
                        </div>
                    </button>
                    <button type="button" onclick="setJenis(120)" id="btn-jenis-120" class="jenis-btn relative p-4 rounded-xl border-2 border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 font-medium text-sm transition-all flex items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-slate-900/50 flex items-center justify-center">
                            <i class="fa-solid fa-building text-slate-400"></i>
                        </div>
                        <div class="text-left">
                            <div class="block">Non Pertanian</div>
                            <div class="text-xs text-slate-500 font-normal">Koefisien: 120</div>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Input Fields -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label for="luas" class="text-sm font-semibold text-slate-300 uppercase tracking-wider flex items-center gap-2">
                        Luas Tanah (m²)
                    </label>
                    <div class="relative">
                        <input type="number" id="luas" oninput="calculate()" placeholder="0" min="0"
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all font-mono text-lg">
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 font-mono">m²</span>
                    </div>
                </div>

                <!-- Hidden by default, only shows on Pemecahan (Model 3) -->
                <div id="container-bidang" class="space-y-2 hidden opacity-0 transition-opacity duration-300">
                    <label for="bidang" class="text-sm font-semibold text-slate-300 uppercase tracking-wider">
                        Jml Bidang Hasil
                    </label>
                    <input type="number" id="bidang" oninput="calculate()" placeholder="0" min="0"
                        class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all font-mono text-lg">
                </div>
            </div>
        </div>

        <!-- Result Section -->
        <div class="bg-slate-900/80 border-t border-slate-800 p-6 sm:p-8">
            <div class="flex flex-col sm:flex-row items-start sm:items-end justify-between gap-4">
                <div class="space-y-1 w-full">
                    <p class="text-slate-400 text-sm">Total Biaya PNBP</p>
                    <p id="result-price" class="text-3xl sm:text-4xl font-bold text-white tracking-tight break-all">Rp 0</p>
                </div>
                
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 w-full sm:w-auto min-w-[250px]">
                    <p class="text-xs text-slate-500 font-semibold mb-1 uppercase tracking-wider">Detail Rumus</p>
                    <p id="result-formula" class="text-xs text-slate-400 font-mono leading-relaxed">Pilih model dan isi form di atas.</p>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // State variables
        let currentState = {
            model: 1,
            jenis: 60, // 60 = Pertanian, 120 = Non Pertanian
            luas: 0,
            bidang: 0
        };

        // DOM Elements
        const luasInput = document.getElementById('luas');
        const bidangInput = document.getElementById('bidang');
        const containerBidang = document.getElementById('container-bidang');
        const resultPrice = document.getElementById('result-price');
        const resultFormula = document.getElementById('result-formula');

        // Formatter for Rupiah
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(number);
        };

        // Format number for display in formulas (adds dots)
        const formatNum = (num) => {
            return new Intl.NumberFormat('id-ID').format(num);
        };

        function setModel(modelId) {
            currentState.model = modelId;
            
            // Update UI buttons for Model
            for(let i = 1; i <= 3; i++) {
                const btn = document.getElementById(`btn-model-${i}`);
                const icon = btn.querySelector('i');
                if(i === modelId) {
                    btn.className = "model-btn relative p-4 rounded-xl border-2 border-brand-500 bg-brand-500/10 text-white font-medium text-sm transition-all text-left flex flex-col gap-2";
                    icon.classList.remove('text-slate-400');
                    icon.classList.add('text-brand-500');
                } else {
                    btn.className = "model-btn relative p-4 rounded-xl border-2 border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 font-medium text-sm transition-all text-left flex flex-col gap-2";
                    icon.classList.remove('text-brand-500');
                    icon.classList.add('text-slate-400');
                }
            }

            // Show/Hide Jumlah Bidang Hasil input
            if(modelId === 3) {
                containerBidang.classList.remove('hidden');
                // slight delay for transition effect
                setTimeout(() => {
                    containerBidang.classList.remove('opacity-0');
                    containerBidang.classList.add('opacity-100');
                }, 10);
            } else {
                containerBidang.classList.remove('opacity-100');
                containerBidang.classList.add('opacity-0');
                setTimeout(() => {
                    containerBidang.classList.add('hidden');
                }, 300); // match transition duration
                currentState.bidang = 0; // reset
                bidangInput.value = '';
            }

            calculate();
        }

        function setJenis(koefisien) {
            currentState.jenis = koefisien;

            const btn60 = document.getElementById('btn-jenis-60');
            const btn120 = document.getElementById('btn-jenis-120');

            if(koefisien === 60) {
                // Set active 60
                btn60.className = "jenis-btn relative p-4 rounded-xl border-2 border-brand-500 bg-brand-500/10 text-white font-medium text-sm transition-all flex items-center gap-3";
                btn60.querySelector('i').className = "fa-solid fa-leaf text-brand-500";
                btn60.querySelector('.text-xs').className = "text-xs text-brand-500/80 font-normal";
                
                // Set inactive 120
                btn120.className = "jenis-btn relative p-4 rounded-xl border-2 border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 font-medium text-sm transition-all flex items-center gap-3";
                btn120.querySelector('i').className = "fa-solid fa-building text-slate-400";
                btn120.querySelector('.text-xs').className = "text-xs text-slate-500 font-normal";
            } else {
                // Set active 120
                btn120.className = "jenis-btn relative p-4 rounded-xl border-2 border-brand-500 bg-brand-500/10 text-white font-medium text-sm transition-all flex items-center gap-3";
                btn120.querySelector('i').className = "fa-solid fa-building text-brand-500";
                btn120.querySelector('.text-xs').className = "text-xs text-brand-500/80 font-normal";
                
                // Set inactive 60
                btn60.className = "jenis-btn relative p-4 rounded-xl border-2 border-slate-700 bg-slate-800 text-slate-400 hover:border-slate-600 font-medium text-sm transition-all flex items-center gap-3";
                btn60.querySelector('i').className = "fa-solid fa-leaf text-slate-400";
                btn60.querySelector('.text-xs').className = "text-xs text-slate-500 font-normal";
            }

            calculate();
        }

        function calculate() {
            // Update state from inputs
            currentState.luas = parseFloat(luasInput.value) || 0;
            currentState.bidang = parseFloat(bidangInput.value) || 0;

            let total = 0;
            let formulaStr = "";

            const luas = currentState.luas;
            const koef = currentState.jenis;
            const bidang = currentState.bidang;

            // Model 1: Pengukuran Pertama
            // Rumus = 100.000 + (Luas(m2) * Koefisien)
            if (currentState.model === 1) {
                total = 100000 + (luas * koef);
                formulaStr = `100.000 + (${formatNum(luas)} × ${koef})`;
            } 
            
            // Model 2: Penataan Batas
            // Rumus = 100.000 + (Luas(m2) * Koefisien) + 50.000
            else if (currentState.model === 2) {
                total = 100000 + (luas * koef) + 50000;
                formulaStr = `100.000 + (${formatNum(luas)} × ${koef}) + 50.000`;
            } 
            
            // Model 3: Pemecahan
            // Rumus = 100.000 + (Luas(m2) * Jumlah Bidang Hasil) + ((Koefisien - 1) * 100.000) + 100.000
            else if (currentState.model === 3) {
                total = 100000 + (luas * koef) + ((bidang - 1) * 100000) + 100000;
                formulaStr = `100.000 + (${formatNum(luas)} × ${formatNum(koef)}) + ((${bidang} - 1) × 100.000) + 100.000`;
            }

            // Update DOM with slight pop animation
            resultPrice.style.transform = 'scale(0.95)';
            resultPrice.style.opacity = '0.5';
            
            setTimeout(() => {
                resultPrice.innerText = formatRupiah(total);
                resultFormula.innerText = formulaStr;
                resultPrice.style.transition = 'all 0.2s ease-out';
                resultPrice.style.transform = 'scale(1)';
                resultPrice.style.opacity = '1';
            }, 100);
        }

        // Initialize default calculation
        calculate();
    </script>
</body>
</html>
