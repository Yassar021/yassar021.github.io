<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Meta Viewport yang dioptimalkan untuk Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loket Kantah Mamuju Tengah</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Signature Pad -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/1.5.3/signature_pad.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        atr: {
                            blue: '#003060',
                            light: '#0a4d91'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Optimasi tambahan agar tidak horizontal scroll di perangkat mobile */
        html, body { 
            background-color: #f8fafc; 
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden; 
            margin: 0;
            padding: 0;
        }
        .glass-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }
        /* Kelas custom tambahan agar input form nyaman disentuh di mobile */
        .input-responsif {
            @apply w-full px-3 py-2.5 sm:px-4 sm:py-2 min-h-[44px] sm:min-h-0 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue text-sm sm:text-base transition-colors bg-white;
        }
    </style>
</head>
<body class="py-6 sm:py-8 md:py-10 px-4 sm:px-6 lg:px-8 text-slate-800">

    <div class="max-w-4xl mx-auto w-full">
        <!-- Header -->
        <div class="text-center mb-6 sm:mb-8 md:mb-10 w-full px-2">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-bold text-atr-blue mb-2 font-poppins">Loket Pembayaran Layanan</h1>
            <p class="text-sm sm:text-base text-slate-500 max-w-lg mx-auto">Form ini digunakan untuk loket pembayaran layanan pertanahan.</p>
        </div>

        <form id="mainForm" class="space-y-6 sm:space-y-8 w-full">
            
            <!-- Section 1 -->
            <div class="glass-card p-5 sm:p-6 md:p-8 w-full">
                <h2 class="text-base sm:text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Informasi Administratif</h2>
                <!-- GRID: 1 Kolom di HP, 2 Kolom di Tablet/Laptop -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5 w-full">
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Hari/Tanggal</label>
                        <input type="date" id="tanggal" name="tanggal" required class="input-responsif">
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Jenis Berkas</label>
                        <select id="jenis_berkas" name="jenis_berkas" required class="input-responsif appearance-none w-full text-ellipsis overflow-hidden whitespace-nowrap">
                            <option value="" disabled selected>Pilih Jenis Berkas...</option>
                            <option value="Pengecekan Sertipikat">Pengecekan Sertipikat</option>
                            <option value="SKPT">SKPT</option>
                            <option value="Hak Tanggungan Elektronik">Hak Tanggungan Elektronik</option>
                            <option value="Roya">Roya</option>
                            <option value="Peralihan Hak - Jual Beli">Peralihan Hak - Jual Beli</option>
                            <option value="Peralihan Hak - Pewarisan">Peralihan Hak - Pewarisan</option>
                            <option value="Peralihan Hak - Hibah">Peralihan Hak - Hibah</option>
                            <option value="Peralihan Hak - APHB">Peralihan Hak - APHB</option>
                            <option value="SK">SK</option>
                            <option value="Pendaftaran SK Hak">Pendaftaran SK Hak</option>
                            <option value="Ganti Blanko Hilang">Ganti Blanko Hilang</option>
                            <option value="Ganti Blanko Lama">Ganti Blanko Lama</option>
                            <option value="Pemecahan/Pemisahan">Pemecahan/Pemisahan</option>
                            <option value="Penataan Batas">Penataan Batas</option>
                            <option value="Pewarisan">Pewarisan</option>
                            <option value="Ganti Nama">Ganti Nama</option>
                            <option value="Pindah Desa">Pindah Desa</option>
                            <option value="Hapusnya Hak">Hapusnya Hak</option>
                            <option value="Perubahan (Peningkatan) Hak">Perubahan (Peningkatan) Hak</option>
                            <option value="PKKPR Non Berusaha">PKKPR Non Berusaha</option>
                            <option value="PTP Kebijakan">PTP Kebijakan</option>
                            <option value="Pencatatan PKKPR">Pencatatan PKKPR</option>
                            <option value="Wakaf">Wakaf</option>
                        </select>
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">No Berkas</label>
                        <input type="text" id="no_berkas" name="no_berkas" placeholder="Masukkan Nomor Berkas" required class="input-responsif">
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Keterangan Berkas</label>
                        <input type="text" id="keterangan" name="keterangan" placeholder="Keterangan..." class="input-responsif">
                    </div>
                    <!-- Span 2 kolom khusus di layar besar jika perlu, atau dibiarkan seperti ini agar sejajar -->
                    <div class="flex items-center md:items-end md:pb-2 pt-2 md:pt-0 w-full">
                    <label class="relative flex items-center cursor-pointer group w-full">
                        <input type="checkbox" id="tahun" name="tahun" value="2026" class="w-5 h-5 sm:w-6 sm:h-6 text-atr-blue border-slate-300 rounded focus:ring-atr-blue cursor-pointer shrink-0">
                        <span class="ml-2 sm:ml-3 block text-sm sm:text-base font-medium text-slate-700 group-hover:text-atr-blue transition-colors">Tahun 2026</span>
                    </label>
                    </div>
                </div>
            </div>

            <!-- Section 2 -->
            <div class="glass-card p-5 sm:p-6 md:p-8 w-full">
                <h2 class="text-base sm:text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Data Pihak Terkait</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5 w-full">
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Penerima Kuasa (Pemohon)</label>
                        <input type="text" id="penerima_kuasa" name="penerima_kuasa" required placeholder="Nama Pemohon" class="input-responsif">
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Pemberi Kuasa <span class="font-normal text-slate-400 ml-1">(Opsional)</span></label>
                        <input type="text" id="pemberi_kuasa" name="pemberi_kuasa" placeholder="Nama Pemberi Kuasa" class="input-responsif">
                    </div>
                    <!-- Membuat form No TLP melebar penuh di HP, tapi 1 kolom di Laptop -->
                    <div class="md:col-span-1 w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Nomor Telepon/HP</label>
                        <input type="tel" id="no_tlp" name="no_tlp" required placeholder="08xxxxxxxxxx" class="input-responsif">
                    </div>                    
                </div>
            </div>

            <!-- Section 3 -->
            <div class="glass-card p-5 sm:p-6 md:p-8 w-full">
                <h2 class="text-base sm:text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Data Objek Pertanahan</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 sm:gap-5 w-full">
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Jenis Sertipikat</label>
                        <select id="jenis_sertipikat" name="jenis_sertipikat" required class="input-responsif appearance-none w-full">
                            <option value="" disabled selected>Pilih...</option>
                            <option value="Sertipikat Analog">Sertipikat Analog</option>
                            <option value="Sertipikat Elektronik">Sertipikat Elektronik</option>
                            <option value="Belum Bersertifikat">Belum Bersertifikat</option>
                        </select>
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Jenis Hak</label>
                        <select id="jenis_hak" name="jenis_hak" required class="input-responsif appearance-none w-full">
                            <option value="" disabled selected>Pilih...</option>
                            <option value="Hak Milik">Hak Milik</option>
                            <option value="Hak Guna Bangunan">Hak Guna Bangunan</option>
                            <option value="Hak Pakai Perorangan">Hak Pakai Perorangan</option>
                            <option value="Hak Pakai Instansi">Hak Pakai Instansi</option>
                        </select>
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Nomor Hak / NIBel</label>
                        <input type="text" id="nomor_hak" name="nomor_hak" required placeholder="Nomor Hak/NIBel" class="input-responsif">
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Nomor Hak Tanggungan (Roya)</label>
                        <input type="text" id="no_ht" name="no_ht" placeholder="Isi jika berkaitan dengan Roya" class="input-responsif">
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Desa / Kelurahan</label>
                        <input type="text" id="desa" name="desa" required placeholder="Nama Desa" class="input-responsif">
                    </div>
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Atas Nama</label>
                        <input type="text" id="atas_nama" name="atas_nama" required placeholder="Nama pada Sertipikat" class="input-responsif">
                    </div>
                </div>
            </div>

            <!-- Section 4: Pengesahan -->
            <div class="glass-card p-5 sm:p-6 md:p-8 w-full">
                <h2 class="text-base sm:text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Pengesahan</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8 w-full">
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-1">Teknis / Penerima Berkas</label>
                        <input type="text" id="penerima_berkas" name="penerima_berkas" required placeholder="Nama Petugas" class="input-responsif">
                    </div>
                    
                    <div class="w-full">
                        <label class="block text-xs sm:text-sm font-medium text-slate-700 mb-2">Tanda Tangan Penerima Berkas</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl overflow-hidden bg-slate-50 relative w-full" id="canvas-container">
                            <!-- Tinggi Canvas Responsif: 160px di HP, 192px di Laptop -->
                            <canvas id="signature-pad" class="w-full h-40 md:h-48 touch-none cursor-crosshair block"></canvas>
                            
                            <div class="absolute bottom-2 right-2 flex gap-2">
                                <button type="button" id="clear-signature" class="bg-white/90 backdrop-blur-sm text-slate-600 hover:text-red-600 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg shadow-sm text-xs sm:text-sm font-medium border border-slate-200 flex items-center gap-1 transition-all active:scale-95">
                                    <span class="material-icons-round text-[16px] sm:text-[18px]">delete</span> Hapus
                                </button>
                            </div>
                        </div>
                        <!-- INPUT TERSEMBUNYI UNTUK MENGIRIM TANDA TANGAN -->
                        <input type="hidden" id="signature" name="signature">
                    </div>
                </div>
            </div>

            <!-- Tombol Submit Responsif -->
            <div class="pt-2 pb-6 w-full">
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-[#003060] to-[#0a4d91] hover:opacity-90 text-white font-poppins font-semibold py-3.5 sm:py-4 px-4 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2 active:scale-[0.98] text-sm sm:text-base">
                    Kirim Data Ekspedisi <span class="material-icons-round text-[18px] sm:text-[20px]">send</span>
                </button>
            </div>

        </form>
    </div>

    <script>
        // Set tanggal hari ini otomatis
        document.getElementById('tanggal').valueAsDate = new Date();

        // Setup Signature Pad
        const canvas = document.getElementById('signature-pad');
        const signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgba(255, 255, 255, 0)',
            penColor: 'rgb(15, 23, 42)'
        });

        // FUNGSI RESIZE CANVAS (Disesuaikan agar responsif di HP/Tablet/Laptop)
        function resizeCanvas() {
            const ratio =  Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            
            // Jaga tanda tangan jika ada saat rotasi layar
            if(!signaturePad.isEmpty()){
                const data = signaturePad.toData();
                signaturePad.clear();
                signaturePad.fromData(data);
            } else {
                signaturePad.clear();
            }
        }
        
        // Panggil saat load layar
        window.addEventListener("resize", resizeCanvas);
        
        // Panggil saat HP dirotasi (Potrait ke Landscape)
        window.addEventListener("orientationchange", function() {
            setTimeout(resizeCanvas, 200); 
        });
        
        // Timeout kecil agar DOM container selesai merender secara total sebelum setup canvas width/height
        setTimeout(resizeCanvas, 50);

        // Tombol hapus Tanda Tangan
        document.getElementById('clear-signature').addEventListener('click', () => {
            signaturePad.clear();
        });

        // HANDLE SUBMIT DENGAN AMAN
        const form = document.getElementById("mainForm");
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener("submit", function(event) {
            // MENCEGAH HALAMAN PUTIH / REFRESH
            event.preventDefault();

            // Cek Tanda Tangan
            if (signaturePad.isEmpty()) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Tanda Tangan Kosong',
                    text: 'Mohon berikan tanda tangan penerima berkas sebelum mengirim.',
                    confirmButtonColor: '#003060'
                }).then(() => {
                    // Otomatis scroll ke bagian tanda tangan jika kosong
                    document.getElementById('canvas-container').scrollIntoView({ behavior: 'smooth', block: 'center' });
                });
                return;
            }

            // Memasukkan data coretan ke dalam input tersembunyi agar terbaca oleh Code.gs
            document.getElementById('signature').value = signaturePad.toDataURL('image/png');

            // Ubah tombol jadi loading
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="material-icons-round animate-spin">autorenew</span> Memproses...`;

            Swal.fire({
                title: "Sedang Menyimpan",
                text: "Memproses data dan mengunggah ke sistem...",
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            // Eksekusi ke Google Apps Script backend
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (response) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Berhasil!',
                            text: 'Data telah tersimpan di Sistem.',
                            confirmButtonColor: '#003060'
                        }).then(() => {
                            // Reset Formulir
                            form.reset();
                            signaturePad.clear();
                            document.getElementById('tanggal').valueAsDate = new Date(); // set tanggal lagi
                            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll kembali ke atas
                            
                            // Kembalikan Tombol
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalBtnText;
                        });
                    })
                    .withFailureHandler(function(error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Gagal Menyimpan',
                            text: 'Pesan sistem: ' + error.message,
                            confirmButtonColor: '#d33'
                        });
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    })
                    .submitForm(form); // <-- Kirim objek form HTML yang utuh
            } else {
                // Fallback Mode Preview jika dijalankan di komputer lokal
                setTimeout(() => {
                    Swal.fire('Mode Simulasi', 'Sistem berhasil menangkap form (Mode Pratinjau Lokal).', 'info');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }, 1500);
            }
        });
    </script>
</body>
</html>
