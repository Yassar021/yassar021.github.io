<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loket Kantah Mamuju Tengah</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Signature Pad -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/1.5.3/signature_pad.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        atr: {
                            blue: '#003060',
                            light: '#0a4d91'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; }
        .glass-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #f1f5f9;
        }
    </style>
</head>
<body class="py-8 px-4 sm:px-6 lg:px-8 text-slate-800">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-atr-blue mb-2 font-poppins">Loket Pembayaran Layanan</h1>
            <p class="text-slate-500">Form ini digunakan untuk loket pembayaran layanan pertanahan.</p>
        </div>

        <form id="mainForm" class="space-y-6">
            
            <!-- Section 1 -->
            <div class="glass-card p-6">
                <h2 class="text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Informasi Administratif</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Hari/Tanggal</label>
                        <!-- WAJIB ADA atribut name="..." -->
                        <input type="date" id="tanggal" name="tanggal" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Berkas</label>
                        <select id="jenis_berkas" name="jenis_berkas" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue bg-white">
                            <option value="" disabled selected>Pilih Jenis Berkas...</option>
                            <option value="Pengecekan Sertipikat">Pengecekan Sertipikat</option>
                            <option value="SKPT">SKPT</option>
                            <option value="Hak Tanggungan Elektronik">Hak Tanggungan Elektronik</option>
                            <option value="Roya">Roya</option>
                            <option value="Peralihan Hak - Jual Beli">Peralihan Hak - Jual Beli</option>
                            <option value="Peralihan Hak - Pewarisan">Peralihan Hak - Pewarisan</option>
                            <option value="Peralihan Hak - Hibah">Peralihan Hak - Hibah</option>
                            <option value="Peralihan Hak - APHB">Peralihan Hak - APHB</option>
                            <option value="SK">SK</option>
                            <option value="Pendaftaran SK Hak">Pendaftaran SK Hak</option>
                            <option value="Ganti Blanko Hilang">Ganti Blanko Hilang</option>
                            <option value="Ganti Blanko Lama">Ganti Blanko Lama</option>
                            <option value="Pemecahan/Pemisahan">Pemecahan/Pemisahan</option>
                            <option value="Penataan Batas">Penataan Batas</option>
                            <option value="Pewarisan">Pewarisan</option>
                            <option value="Ganti Nama">Ganti Nama</option>
                            <option value="Pindah Desa">Pindah Desa</option>
                            <option value="Hapusnya Hak">Hapusnya Hak</option>
                            <option value="Perubahan (Peningkatan) Hak">Perubahan (Peningkatan) Hak</option>
                            <option value="PKKPR Non Berusaha">PKKPR Non Berusaha</option>
                            <option value="PTP Kebijakan">PTP Kebijakan</option>
                            <option value="Pencatatan PKKPR">Pencatatan PKKPR</option>
                            <option value="Wakaf">Wakaf</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">No Berkas</label>
                        <input type="text" id="no_berkas" name="no_berkas" placeholder="Masukkan Nomor Berkas" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                     <div class="flex items-center mt-1 md:mt-2">
                      <input type="checkbox" id="tahun" name="tahun" value="2026" class="w-5 h-5 text-atr-blue border-slate-300 rounded focus:ring-atr-blue">
                      <label for="tahun" class="ml-2 block text-sm font-medium text-slate-700">Tahun 2026</label>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Keterangan Berkas</label>
                        <input type="text" id="keterangan" name="keterangan" placeholder="Keterangan..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>                   
                </div>
            </div>

            <!-- Section 2 -->
            <div class="glass-card p-6">
                <h2 class="text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Data Pihak Terkait</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Penerima Kuasa (Pemohon)</label>
                        <input type="text" id="penerima_kuasa" name="penerima_kuasa" required placeholder="Nama Pemohon" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Pemberi Kuasa</label>
                        <input type="text" id="pemberi_kuasa" name="pemberi_kuasa" placeholder="Nama Pemberi Kuasa (Opsional)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Telepon/HP</label>
                        <input type="tel" id="no_tlp" name="no_tlp" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>                    
                </div>
            </div>

            <!-- Section 3 -->
            <div class="glass-card p-6">
                <h2 class="text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Data Objek Pertanahan</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Sertipikat</label>
                        <select id="jenis_sertipikat" name="jenis_sertipikat" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue bg-white">
                            <option value="" disabled selected>Pilih...</option>
                            <option value="Sertipikat Analog">Sertipikat Analog</option>
                            <option value="Sertipikat Elektronik">Sertipikat Elektronik</option>
                            <option value="Belum Bersertipikat">Belum Bersertipikat</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Hak</label>
                        <select id="jenis_hak" name="jenis_hak" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue bg-white">
                            <option value="" disabled selected>Pilih...</option>
                            <option value="Hak Milik">Hak Milik</option>
                            <option value="Hak Guna Bangunan">Hak Guna Bangunan</option>
                            <option value="Hak Pakai Perorangan">Hak Pakai Perorangan</option>
                            <option value="Hak Pakai Instansi">Hak Pakai Instansi</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Hak / NIBel</label>
                        <input type="text" id="nomor_hak" name="nomor_hak" required placeholder="Nomor Hak/NIBel" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Hak Tanggungan (Roya)</label>
                        <input type="text" id="no_ht" name="no_ht" placeholder="Isi jika berkaitan dengan Roya" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Desa / Kelurahan</label>
                        <input type="text" id="desa" name="desa" placeholder="Nama Desa" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Atas Nama</label>
                        <input type="text" id="atas_nama" name="atas_nama" required placeholder="Nama pada Sertipikat" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                </div>
            </div>

            <!-- Section 4: Pengesahan -->
            <div class="glass-card p-6">
                <h2 class="text-lg font-poppins font-semibold text-atr-blue mb-4 border-b pb-2">Pengesahan</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Teknis / Penerima Berkas</label>
                        <input type="text" id="penerima_berkas" name="penerima_berkas" required placeholder="Nama Petugas" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-atr-blue focus:border-atr-blue">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Tanda Tangan Penerima Berkas</label>
                        <div class="border-2 border-dashed border-slate-300 rounded-xl overflow-hidden bg-slate-50 relative" id="canvas-container">
                            <canvas id="signature-pad" class="w-full h-40 touch-none cursor-crosshair"></canvas>
                            
                            <div class="absolute bottom-2 right-2 flex gap-2">
                                <button type="button" id="clear-signature" class="bg-white/80 backdrop-blur-sm text-slate-600 hover:text-red-600 px-3 py-1.5 rounded-lg shadow-sm text-sm font-medium border border-slate-200 flex items-center gap-1">
                                    <span class="material-icons-round" style="font-size: 16px;">delete</span> Hapus
                                </button>
                            </div>
                        </div>
                        <!-- INPUT TERSEMBUNYI UNTUK MENGIRIM TANDA TANGAN -->
                        <input type="hidden" id="signature" name="signature">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-[#003060] to-[#0a4d91] hover:opacity-90 text-white font-poppins font-semibold py-4 px-4 rounded-xl shadow-lg transition-all flex justify-center items-center gap-2">
                Kirim Data Ekspedisi <span class="material-icons-round">send</span>
            </button>

        </form>
    </div>

    <script>
        // Set tanggal hari ini otomatis
        document.getElementById('tanggal').valueAsDate = new Date();

        // Setup Signature Pad
        const canvas = document.getElementById('signature-pad');
        const signaturePad = new SignaturePad(canvas, {
            backgroundColor: 'rgba(255, 255, 255, 0)',
            penColor: 'rgb(15, 23, 42)'
        });

        function resizeCanvas() {
            const ratio =  Math.max(window.devicePixelRatio || 1, 1);
            canvas.width = canvas.offsetWidth * ratio;
            canvas.height = canvas.offsetHeight * ratio;
            canvas.getContext("2d").scale(ratio, ratio);
            signaturePad.clear(); // Bersihkan jika dilayarnya diresize agar tidak pecah
        }
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        document.getElementById('clear-signature').addEventListener('click', () => {
            signaturePad.clear();
        });

        // HANDLE SUBMIT DENGAN AMAN
        const form = document.getElementById("mainForm");
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener("submit", function(event) {
            // MENCEGAH HALAMAN PUTIH / REFRESH
            event.preventDefault();

            // Cek Tanda Tangan
            if (signaturePad.isEmpty()) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Tanda Tangan Kosong',
                    text: 'Mohon berikan tanda tangan pemohon sebelum mengirim.',
                    confirmButtonColor: '#003060'
                });
                return;
            }

            // Memasukkan data coretan ke dalam input tersembunyi agar terbaca oleh Code.gs
            document.getElementById('signature').value = signaturePad.toDataURL('image/png');

            // Ubah tombol jadi loading
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="material-icons-round animate-spin">autorenew</span> Memproses...`;

            Swal.fire({
                title: "Sedang Menyimpan",
                text: "Memproses data dan mengunggah ke sistem...",
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            // Eksekusi ke Google Apps Script backend
            if (typeof google !== 'undefined' && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(function (response) {
                        Swal.fire({
                            icon: 'success',
                            title: 'Berhasil!',
                            text: 'Data telah tersimpan di Sistem.',
                            confirmButtonColor: '#003060'
                        }).then(() => {
                            // Reset Formulir
                            form.reset();
                            signaturePad.clear();
                            document.getElementById('tanggal').valueAsDate = new Date(); // set tanggal lagi
                            
                            // Kembalikan Tombol
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalBtnText;
                        });
                    })
                    .withFailureHandler(function(error) {
                        Swal.fire({
                            icon: 'error',
                            title: 'Gagal Menyimpan',
                            text: 'Pesan sistem: ' + error.message,
                            confirmButtonColor: '#d33'
                        });
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    })
                    .submitForm(form); // <-- Kirim objek form HTML yang utuh
            } else {
                // Fallback Mode Preview jika dijalankan di komputer lokal
                setTimeout(() => {
                    Swal.fire('Mode Simulasi', 'Sistem berhasil menangkap form (Mode Pratinjau).', 'info');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnText;
                }, 1500);
            }
        });
    </script>
</body>
</html>
